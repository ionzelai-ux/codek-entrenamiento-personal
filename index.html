<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Codek Training — Entrenamiento Personal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%238B2020'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="demo-banner" id="demo-banner" hidden>MODO DEMO · datos ficticios en memoria, no se guarda nada</div>

<!-- LOGIN -->
<div class="login-wrap" id="login" hidden>
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="logo-title">⬛ CODEK</div>
    <div class="logo-sub">Training · Entrenamiento Personal</div>
    <div class="form-group" style="margin-top:26px">
      <label class="form-label" for="usuario">Usuario</label>
      <input class="form-input" id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="clave">Contraseña</label>
      <input class="form-input" id="clave" name="clave" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-error" id="login-error" hidden></div>
    <button class="btn btn-primary btn-w" type="submit">Entrar</button>
    <p class="hint" id="login-demo" hidden style="margin-top:14px">Demo: usuario <b>admin</b>, <b>eduardo</b> o <b>jesus</b> · contraseña <b>demo</b></p>
  </form>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div>
      <div class="logo-title">⬛ CODEK</div>
      <div class="logo-sub">Training · EP Manager</div>
    </div>
    <nav class="nav-tabs" id="nav"></nav>
    <div class="header-der" id="cabecera-der"></div>
  </header>
  <main id="vista"></main>
</div>

<div id="modales"></div>
<div id="toasts"></div>

<noscript><p style="padding:24px;color:#ccc">Esta aplicación necesita JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
